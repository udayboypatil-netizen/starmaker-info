<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050507">
<title>StarLookup — StarMaker Profile Search</title>
<style>
:root{color-scheme:dark;--bg:#050507;--panel:#0d0d13;--line:#252332;--muted:#a4a1b2;--purple:#9333ea;--cyan:#06b6d4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#26113e 0,transparent 48%),var(--bg);color:#f7f5fb;font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{width:min(960px,92%);margin:auto}.top{padding:24px 0;border-bottom:1px solid #ffffff12}.brand{font-size:23px;font-weight:800;letter-spacing:-.6px}.brand span{color:#c084fc}.tag{color:var(--muted);font-size:13px}
main{padding:44px 0 70px}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:0 0 10px}.hero p{color:var(--muted);margin:0}
.search{display:flex;gap:10px;padding:10px;background:#101018;border:1px solid var(--line);border-radius:18px;max-width:680px;margin:24px auto 12px;box-shadow:0 12px 40px #0008}
input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:white;padding:10px 12px;font-size:16px}
button{border:0;border-radius:12px;background:linear-gradient(110deg,var(--purple),#6d28d9);color:white;font-weight:750;padding:12px 22px;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.note{text-align:center;color:#858194;font-size:12px}.status{text-align:center;min-height:26px;margin:18px 0;color:#c4b5fd}
.hidden{display:none!important}.panel{background:linear-gradient(145deg,#11111a,#0a0a0f);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 18px 55px #0006}
.profile{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#242033;border:3px solid #9333ea88}.name{font-size:25px;font-weight:800;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:13px}.vip{display:inline-block;color:#ffc078;border:1px solid #a16207;border-radius:99px;padding:2px 9px;font-size:11px;margin-left:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}.field{background:#14141d;border:1px solid #272536;border-radius:13px;padding:12px;min-width:0}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9d98ad}.value{font-weight:650;margin-top:4px;overflow-wrap:anywhere}.value a{color:#67e8f9}.section-title{font-size:18px;font-weight:800;margin:0 0 12px}.family-head{display:flex;align-items:center;gap:14px}.family-icon{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#222}.family-cover{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:14px}
footer{text-align:center;color:#716d7e;font-size:12px;padding:26px;border-top:1px solid #ffffff12}
@media(max-width:520px){main{padding-top:30px}.search{flex-direction:column}.search button{width:100%}.panel{padding:16px}.avatar{width:82px;height:82px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">Star<span>Lookup</span></div><div class="tag">StarMaker profile information by SID</div></div></header>
<main class="wrap">
<section class="hero"><h1>Find a StarMaker Profile</h1><p>Enter a StarMaker SID to view the profile details available from the lookup service.</p></section>
<form id="searchForm" class="search"><input id="sid" inputmode="numeric" autocomplete="off" placeholder="Enter StarMaker SID" aria-label="StarMaker SID" maxlength="20" required><button id="searchBtn">Search</button></form>
<div class="note">SID only · No recording ID required</div>
<div id="status" class="status" role="status"></div>
<section id="result" class="hidden" aria-live="polite">
<div class="panel"><div class="profile"><img id="avatar" class="avatar" alt="Profile picture"><div><div id="name" class="name"></div><div id="sidText" class="sub"></div><div id="vipText"></div></div></div><div id="userGrid" class="grid"></div></div>
<div id="familyPanel" class="panel hidden"><h2 class="section-title">Family Information</h2><div class="family-head"><img id="familyIcon" class="family-icon" alt="Family icon"><div><div id="familyName" class="name" style="font-size:20px"></div><div id="familySlogan" class="sub"></div></div></div><img id="familyCover" class="family-cover hidden" alt="Family cover"><div id="familyGrid" class="grid"></div></div>
</section>
</main>
<footer>StarLookup · Profile fields are shown only when returned by the lookup provider.</footer>
<script>
const API = "https://vkpvkobuebfqhzklduvr.supabase.co/functions/v1/swift-processor";
const $ = id => document.getElementById(id);
function addField(parent,label,value){
 if(value===undefined||value===null||value===""||value==="N/A") return;
 const box=document.createElement("div");box.className="field";
 const l=document.createElement("div");l.className="label";l.textContent=label;
 const v=document.createElement("div");v.className="value";
 if(typeof value==="string" && /^https:\/\//i.test(value)){const a=document.createElement("a");a.href=value;a.target="_blank";a.rel="noopener";a.textContent="Open image";v.append(a)}
 else v.textContent=String(value);
 box.append(l,v);parent.append(box);
}
function renderGrid(id,obj,omit=[]){
 const el=$(id);el.replaceChildren();
 const labels={signature:"Bio",gender:"Gender",user_level:"User level",created_on:"Account created",updated_date:"Last updated",is_vip:"VIP",vip_level:"VIP level",asset_range:"Asset range",is_pro:"Pro",is_noble:"Noble",noble_name:"Noble name",noble_end_date:"Noble expiry",family_id_in_user:"Family ID",id:"Profile ID",member_num:"Members",max_member_num:"Maximum members",online_num:"Members online",created_date:"Family created",country:"Country"};
 for(const [key,val] of Object.entries(obj||{})){if(omit.includes(key)||["profile_image","vip_level_anim_icon","pendant_static_url","pendant_dynamic_url","cover_url","icon","background","level_icon"].includes(key))continue;addField(el,labels[key]||key.replaceAll("_"," "),val)}
}
function image(id,url){const el=$(id);if(url){el.src=url;el.classList.remove("hidden")}else{el.removeAttribute("src");el.classList.add("hidden")}}
function showProfile(payload){
 const data=payload?.data||payload;const user=data?.user||payload?.user;const family=data?.family||payload?.family;
 if(!user)throw new Error(payload?.message||"Profile data was not returned for this SID.");
 $("result").classList.remove("hidden");
 image("avatar",user.profile_image);
 $("name").textContent=user.stage_name||user.name||"StarMaker User";
 $("sidText").textContent="SID: "+(user.sid||$("sid").value);
 $("vipText").innerHTML="";
 if(user.is_vip===true){const b=document.createElement("span");b.className="vip";b.textContent="VIP"+(user.vip_level?" "+user.vip_level:"");$("vipText").append(b)}
 renderGrid("userGrid",user,["sid","name","stage_name"]);
 $("familyPanel").classList.toggle("hidden",!family);
 if(family){image("familyIcon",family.icon);image("familyCover",family.cover_url);$("familyName").textContent=family.name||"Family";$("familySlogan").textContent=family.slogan||"";renderGrid("familyGrid",family,["name","slogan"])}
}
$("searchForm").addEventListener("submit",async e=>{
 e.preventDefault();const sid=$("sid").value.trim();
 if(!/^\d{5,20}$/.test(sid)){$("status").textContent="Please enter a valid SID (5–20 digits).";return}
 $("searchBtn").disabled=true;$("searchBtn").textContent="Searching…";$("status").textContent="Looking up profile…";$("result").classList.add("hidden");
 try{
  const res=await fetch(API+"?sid="+encodeURIComponent(sid),{headers:{"Accept":"application/json"}});
  const data=await res.json();
  if(!res.ok||data.success===false)throw new Error(data.message||data.error||"Lookup failed. Please try again.");
  showProfile(data);$("status").textContent="";
 }catch(err){$("status").textContent=err.message||"Unable to connect. Please try again."}
 finally{$("searchBtn").disabled=false;$("searchBtn").textContent="Search"}
});
</script>
</body></html>
