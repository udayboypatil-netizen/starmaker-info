<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2e5d">
<title>Valmo Pilot</title>
<style>
:root{--navy:#0b315f;--blue:#087fc0;--pale:#f2f3fa;--red:#ed1018;--green:#16a34a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#101820}
body{background:#f1f1f1}
.app{max-width:700px;min-height:100dvh;margin:auto;background:#f1f1f1;display:flex;flex-direction:column;overflow:hidden}
.top{height:82px;background:#fff;display:flex;align-items:center;padding:0 22px;gap:18px;box-shadow:0 2px 5px #00000012;z-index:2}
.back{font-size:32px;line-height:1;color:var(--navy);font-weight:300}
.head{font-size:27px;font-weight:700;letter-spacing:-.5px}
.logo{width:43px;height:43px;flex:none;border-radius:5px;overflow:hidden;background:#0c2e5d}
main{flex:1;display:flex;flex-direction:column;padding:0 0 14px}
.scan-area{position:relative;flex:1;min-height:590px;background:linear-gradient(160deg,#b8b1ac 0%,#756e69 48%,#211f1e 100%);overflow:hidden;display:flex;align-items:center;justify-content:center}
.scan-area:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000012,#00000020 55%,#00000085)}
.scan-frame{position:relative;width:min(64vw,330px);height:min(64vw,330px);max-height:330px;border:5px solid #fff;border-radius:25px;z-index:1;box-shadow:0 0 0 999px #00000012}
.scan-frame:after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ffffffaa;box-shadow:0 0 12px #fff;animation:beam 2.2s ease-in-out infinite}
@keyframes beam{0%,100%{transform:translateY(-105px)}50%{transform:translateY(105px)}}
#video{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;display:none;z-index:0}
.scan-area.camera-on #video{display:block}
.scan-area.camera-on:before{background:linear-gradient(180deg,#00000022,#00000018 55%,#00000078)}
.scan-frame.live:after{z-index:3}
.error{display:none;position:absolute;top:22px;left:4%;right:4%;z-index:4;min-height:78px;border-radius:13px;background:#ed080d;color:white;font-size:19px;font-weight:700;align-items:center;justify-content:center;text-align:center;padding:15px 18px;box-shadow:0 5px 16px #0003}
.error.show{display:flex;animation:drop .18s ease-out}
@keyframes drop{from{transform:translateY(-8px);opacity:.3}to{transform:translateY(0);opacity:1}}
.bottom{background:#f1f1f1;padding:20px 14px calc(16px + env(safe-area-inset-bottom));text-align:center}
.helper{font-size:16px;font-weight:600;color:#74797d;margin:0 0 17px}
.actions{display:flex;gap:10px}
.action{flex:1;min-height:62px;border:0;border-radius:10px;background:#f5f4fc;color:var(--navy);font-size:16px;font-weight:700;padding:10px 8px;cursor:pointer}
.action:active{background:#e7e6f4}
.action svg{width:20px;height:20px;vertical-align:middle;margin-right:7px}
#success{display:none;position:absolute;inset:0;background:#fff;z-index:6;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}
.success-mark{width:94px;height:94px;border-radius:50%;background:#e7f7ec;color:#159447;font-size:58px;font-weight:700;display:grid;place-items:center;margin-bottom:24px}
#success h2{font-size:27px;margin:0 0 25px;color:#132c4c}
.three{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:82px}
.person{width:38px;height:68px;border-radius:18px 18px 7px 7px;background:#e3f5e9;border:2px solid #23a455;position:relative;display:flex;align-items:center;justify-content:center;color:#159447;font-size:24px;font-weight:bold}
.person:nth-child(2){height:80px}
.person:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#23a455;top:-12px}
#success p{font-size:15px;color:#758078;margin:26px 0 0}
#retry{margin-top:28px;background:#0b315f;color:white;border:0;border-radius:10px;padding:15px 35px;font-size:16px;font-weight:700}
#manualModal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:24px}
.dialog{width:min(100%,420px);background:white;border-radius:16px;padding:22px}
.dialog h3{margin:0 0 16px;font-size:20px}
.dialog input{width:100%;height:52px;border:1px solid #cbd3dc;border-radius:9px;padding:0 13px;font-size:17px;outline-color:#0b315f}
.dialog-buttons{display:flex;gap:10px;margin-top:16px}
.dialog-buttons button{flex:1;padding:13px;border:0;border-radius:9px;font-size:15px;font-weight:700}
.cancel{background:#eef1f5;color:#24384e}.submit{background:#0b315f;color:white}
@media(max-height:760px){.scan-area{min-height:430px}.top{height:72px}.head{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<svg class="logo" viewBox="0 0 100 100" aria-label="Valmo Pilot logo">
<rect width="100" height="100" fill="#0c2e5d"/>
<path d="M8 31 48 5h46L55 31z" fill="#55e5f4"/>
<path d="M55 31 94 5v60L55 96z" fill="#087fb8"/>
<path d="M20 39h17l13 27 13-27h17L58 78H43z" fill="white"/>
</svg>
<div class="head">Scan Your Shipments</div>
</header>
<main>
<div class="scan-area" id="scanArea">
<div class="error" id="error" role="alert">⚠ &nbsp; Not found</div>
<div class="scan-frame" id="scanFrame">
<video id="video" playsinline muted></video>
</div>
<section id="success">
<div class="success-mark">✓</div>
<h2>Pickup Successful</h2>
<div class="three" aria-hidden="true"><div class="person">✓</div><div class="person">✓</div><div class="person">✓</div></div>
<p>Shipment scanned successfully</p>
<button id="retry">Scan Another</button>
</section>
</div>
</main>
<footer class="bottom">
<p class="helper">Facing problem with scanner? Use Keyboard</p>
<div class="actions">
<button class="action" id="manualBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h1m3 0h1m3 0h1m3 0h1M6 12h1m3 0h1m3 0h1m3 0h1M7 16h10"/></svg>Enter Waybill no.</button>
</div>
</footer>
</div>
<div id="manualModal">
<div class="dialog">
<h3>Enter Waybill no.</h3>
<input id="waybill" autocomplete="off" placeholder="Scan / enter barcode">
<div class="dialog-buttons"><button class="cancel" id="cancel">Cancel</button><button class="submit" id="check">Submit</button></div>
</div>
</div>
<script>
const video=document.getElementById('video'),frame=document.getElementById('scanFrame'),area=document.getElementById('scanArea'),errorBox=document.getElementById('error');
let stream=null,detector=null,active=false,scanBusy=false,zxingReader=null;
function stopCamera(){active=false;if(zxingReader){try{zxingReader.reset()}catch(e){}zxingReader=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.pause();video.srcObject=null;video.style.display='none';area.classList.remove('camera-on');frame.classList.remove('live')}
function showError(){errorBox.classList.add('show');setTimeout(()=>errorBox.classList.remove('show'),2600)}
function handleWaybill(raw){const value=String(raw||'').trim().toUpperCase();document.getElementById('manualModal').style.display='none';if(/^VLO[O0]/.test(value)){stopCamera();errorBox.classList.remove('show');document.getElementById('success').style.display='flex'}else{showError()}}
async function loadZXing(){if(window.ZXing)return true;return new Promise(resolve=>{const s=document.createElement('script');s.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>resolve(!!window.ZXing);s.onerror=()=>resolve(false);document.head.appendChild(s)})}
async function startScan(){
 errorBox.classList.remove('show');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showErrorText('Camera requires HTTPS and browser permission.');return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  video.srcObject=stream;video.style.display='block';area.classList.add('camera-on');frame.classList.add('live');await video.play();active=true;
  if('BarcodeDetector'in window){
   try{detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf']});scanLoop();return}catch(e){}
  }
  const ok=await loadZXing();
  if(ok&&active){zxingReader=new ZXing.BrowserMultiFormatReader();zxingReader.decodeFromVideoElement(video,(result,err)=>{if(result&&active)handleWaybill(result.getText())})}
  else if(active){showErrorText('Scanner not supported here. Use Enter Waybill no.')}
 }catch(e){stopCamera();showErrorText(e.name==='NotAllowedError'?'Allow camera permission in Chrome site settings.':'Camera could not open. Check HTTPS and camera permission.')}
}
function showErrorText(message){errorBox.textContent='⚠  '+message;errorBox.classList.add('show');setTimeout(()=>{errorBox.classList.remove('show');errorBox.innerHTML='⚠ &nbsp; Not found'},4000)}
async function scanLoop(){if(!active||!detector||scanBusy)return;scanBusy=true;try{if(video.readyState>=2){const found=await detector.detect(video);if(found.length&&found[0].rawValue){handleWaybill(found[0].rawValue);return}}}catch(e){}finally{scanBusy=false}if(active)requestAnimationFrame(scanLoop)}
area.addEventListener('click',e=>{if(e.target.closest('#success'))return;if(!active)startScan()});
document.getElementById('manualBtn').addEventListener('click',()=>{document.getElementById('waybill').value='';document.getElementById('manualModal').style.display='flex';document.getElementById('waybill').focus()});
document.getElementById('cancel').addEventListener('click',()=>document.getElementById('manualModal').style.display='none');
document.getElementById('check').addEventListener('click',()=>handleWaybill(document.getElementById('waybill').value));
document.getElementById('waybill').addEventListener('keydown',e=>{if(e.key==='Enter')handleWaybill(e.target.value)});
document.getElementById('retry').addEventListener('click',()=>{document.getElementById('success').style.display='none';startScan()});
window.addEventListener('pagehide',stopCamera);
</script>
</body>
</html>
